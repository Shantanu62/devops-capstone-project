
[nosetests]
verbosity = 2
with-spec = 1
spec-color = 1
with-coverage = 1
cover-package = service
cover-erase = 1
cover-html = 1
cover-html-dir = coverage

[coverage:run]
source = service
branch = True

[coverage:report]
show_missing = True
skip_covered = False

[flake8]
max-line-length = 127
max-complexity = 10
exclude = .git,.venv,venv,__pycache__
per-file-ignores =
    */__init__.py: F401 E402

[pylint.'MESSAGES CONTROL']
disable = E1101
