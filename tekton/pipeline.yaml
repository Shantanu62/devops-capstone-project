apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: shared-workspace
  tasks:
    - name: clone-and-deploy
      workspaces:
        - name: source
          workspace: shared-workspace
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: clone-repository
            image: alpine/git:2.45.2
            script: |
              #!/bin/sh
              set -eu
              git clone --depth 1 --branch main \
                https://github.com/Shantanu62/devops-capstone-project.git \
                $(workspaces.source.path)/repo

          - name: deploy-application
            image: quay.io/openshift/origin-cli:4.14
            script: |
              #!/bin/sh
              set -eu
              oc apply -f $(workspaces.source.path)/repo/deploy/account-service-deployment.yaml
              oc apply -f $(workspaces.source.path)/repo/deploy/account-service-service.yaml
              oc rollout status deployment/account-service --timeout=120s
              echo "CD DEPLOYMENT SUCCESSFUL"
